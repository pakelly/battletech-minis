<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleTech Mini Collection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <h1>🤖 BattleTech Minis <span class="version">v1.5</span></h1>
            <div class="stats" id="collectionStats">
                <span id="totalCount">Loading...</span>
            </div>
        </header>

        <!-- Controls Bar -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search mech name..." />
            </div>
            <div class="filters">
                <select id="sourceFilter">
                    <option value="">All Sources</option>
                </select>
            </div>
            <div class="view-toggles">
            </div>
        </div>

        <!-- Card Grid -->
        <main>
            <div class="card-grid" id="cardGrid"></div>
        </main>

        <!-- Detail Modal -->
        <div class="modal-overlay" id="detailModal">
            <div class="modal-content">
                <button class="modal-close" id="modalClose">&times;</button>
                <div id="modalBody"></div>
            </div>
        </div>


    </div>

    <script src="app.js"></script>
</body>
</html>
