<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleTech Mini Collection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body class="body-mode-collection">
    <div id="app">
        <!-- Header -->
        <header>
            <h1>🤖 BattleTech Mini Collection <span class="version">v1.4</span></h1>
            <div class="header-right">
                <div class="mode-toggle">
                    <button class="mode-toggle-btn active" id="modeCollection">📦 Collection</button>
                    <button class="mode-toggle-btn" id="modeRarity">📊 Rarity</button>
                </div>
                <div class="stats collection-only" id="collectionStats">
                    <span id="totalCount">Loading...</span>
                    <span id="ownedCount"></span>
                </div>
            </div>
        </header>

        <!-- Collection Controls Bar -->
        <div class="controls collection-only">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search mech name..." />
            </div>
            <div class="filters">
                <select id="factionFilter">
                    <option value="">All Factions</option>
                    <option value="Inner Sphere">Inner Sphere</option>
                    <option value="Clan">Clan</option>
                </select>
                <select id="weightFilter">
                    <option value="">All Weights</option>
                    <option value="Light">Light</option>
                    <option value="Medium">Medium</option>
                    <option value="Heavy">Heavy</option>
                    <option value="Assault">Assault</option>
                    <option value="N/A">Vehicles/Other</option>
                </select>
                <select id="yearFilter">
                    <option value="">All Years</option>
                </select>
                <select id="sourceFilter">
                    <option value="">All Sources</option>
                </select>
                <select id="sortSelect">
                    <option value="name">Sort: Name</option>
                    <option value="year">Sort: Year</option>
                    <option value="weightClass">Sort: Weight</option>
                    <option value="faction">Sort: Faction</option>
                </select>
            </div>
            <div class="view-toggles">
                <label class="owned-only">
                    <input type="checkbox" id="ownedOnlyFilter"> Owned Only
                </label>
                <button id="compareBtn" class="btn-compare" disabled>Compare (0)</button>
            </div>
        </div>

        <!-- Rarity Controls Bar -->
        <div class="rarity-controls rarity-only">
            <div class="search-box">
                <input type="text" id="raritySearchInput" placeholder="Search mech name..." />
            </div>
            <select id="rarityEraSelect">
                <option value="2750">Star League (2750)</option>
                <option value="3028" selected>Succession Wars (3028)</option>
                <option value="3039">War of 3039</option>
                <option value="3050">Clan Invasion (3050)</option>
                <option value="3057">Refusal War (3057)</option>
            </select>
            <select id="rarityFactionSelect">
                <!-- Populated dynamically -->
            </select>
            <select id="rarityWeightFilter">
                <option value="">All Weights</option>
                <option value="Light">Light (≤35)</option>
                <option value="Medium">Medium (40-55)</option>
                <option value="Heavy">Heavy (60-75)</option>
                <option value="Assault">Assault (80-100)</option>
            </select>
            <select id="raritySortSelect">
                <option value="name">Sort: Name</option>
                <option value="tonnage">Sort: Tonnage</option>
                <option value="availability">Sort: Availability</option>
            </select>
            <div class="rarity-legend">
                <div class="legend-item"><span class="legend-swatch rare"></span> Rare (1-3)</div>
                <div class="legend-item"><span class="legend-swatch uncommon"></span> Uncommon (4-6)</div>
                <div class="legend-item"><span class="legend-swatch common"></span> Common (7-10)</div>
                <div class="legend-item"><span class="legend-swatch na"></span> N/A</div>
            </div>
        </div>

        <!-- Card Grid (Collection Mode) -->
        <main class="collection-only">
            <div class="card-grid" id="cardGrid"></div>
        </main>

        <!-- Rarity Table (Rarity Mode) -->
        <main class="rarity-only">
            <div class="rarity-table-container" id="rarityTableContainer"></div>
        </main>

        <!-- Detail Modal -->
        <div class="modal-overlay" id="detailModal">
            <div class="modal-content">
                <button class="modal-close" id="modalClose">&times;</button>
                <div id="modalBody"></div>
            </div>
        </div>

        <!-- Compare Modal -->
        <div class="modal-overlay" id="compareModal">
            <div class="modal-content modal-wide">
                <button class="modal-close" id="compareClose">&times;</button>
                <div id="compareBody"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
